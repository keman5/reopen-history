<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="appName">Reopen History</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="history.css">
</head>
<body class="history-page">
  <main class="app-shell">
    <header class="toolbar">
      <a class="brand" href="history.html" tabindex="-1"><img src="icons/icon48.png" width="28" height="28" alt=""><span data-i18n="appName">Reopen History</span></a>
      <div class="toolbar-links">
        <a id="github-link" class="icon-button" href="https://github.com/keman5/reopen-history" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg aria-hidden="true"><use href="icons/ui.svg#github"/></svg></a>
        <a id="settings-link" class="icon-button" href="options.html" data-i18n-label="settings"><svg aria-hidden="true"><use href="icons/ui.svg#settings"/></svg></a>
      </div>
    </header>
    <div class="content">
      <div class="actions">
        <label class="search"><svg aria-hidden="true"><use href="icons/ui.svg#search"/></svg><input id="search" type="search" data-i18n-placeholder="search" autocomplete="off"></label>
        <button id="reopen" class="primary" aria-controls="history" aria-expanded="true"><svg aria-hidden="true"><use href="icons/ui.svg#return"/></svg><span data-i18n="reopenAction"></span><kbd class="shortcut" aria-hidden="true">⌥ ⇧ T</kbd></button>
      </div>
      <p id="notice" class="notice" hidden data-i18n="safariNotice"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="history" data-i18n-label="history">
        <ul id="list"></ul>
        <p id="empty" class="empty" hidden></p>
        <nav id="pagination" class="pagination" data-i18n-label="history" hidden>
          <button id="previous" class="page-button" data-i18n="previousPage"></button>
          <span id="page-status" role="status" aria-live="polite"></span>
          <button id="next" class="page-button" data-i18n="nextPage"></button>
        </nav>
      </section>
    </div>
    <footer class="footer"><a class="privacy" href="privacy.html" data-i18n-title="privacy"><svg aria-hidden="true"><use href="icons/ui.svg#shield"/></svg><span data-i18n="localOnly"></span></a></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="typography.js"></script>
  <script src="vendor/tldts.js"></script>
  <script src="core.js"></script>
  <script src="history.js"></script>
</body>
</html>
