<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Reopen History</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <a class="brand" href="history.html" tabindex="-1"><img src="icons/icon48.png" width="28" height="28" alt=""><span>Reopen History</span></a>
      <a id="settings-link" class="icon-button" href="options.html" data-i18n-label="settings"><svg aria-hidden="true"><use href="icons/ui.svg#settings"/></svg></a>
    </header>
    <div class="content">
      <div class="heading"><h1 data-i18n="history"></h1><p class="intro" data-i18n="intro"></p></div>
      <label class="search"><svg aria-hidden="true"><use href="icons/ui.svg#search"/></svg><input id="search" type="search" data-i18n-placeholder="search" autocomplete="off"></label>
      <p id="notice" class="notice" hidden data-i18n="safariNotice"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <section class="latest-section" aria-labelledby="latest-heading">
        <h2 id="latest-heading" data-i18n="justClosed"></h2>
        <div class="latest-card">
          <span class="entry-icon featured-icon"><svg aria-hidden="true"><use href="icons/ui.svg#window"/></svg></span>
          <div class="entry-text"><span id="latest-title" class="title"></span><span id="latest-url" class="subtitle"></span></div>
          <button id="reopen" class="primary" aria-controls="history" aria-expanded="true"><svg aria-hidden="true"><use href="icons/ui.svg#return"/></svg><span data-i18n="reopenAction"></span></button>
        </div>
        <p class="hint" data-i18n="pressHint"></p>
      </section>
      <section id="history" aria-labelledby="list-heading">
        <div class="list-heading"><h2 id="list-heading" data-i18n="earlierClosed"></h2><span id="count"></span></div>
        <ul id="list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
    </div>
    <footer class="footer"><span class="privacy" data-i18n-title="privacy"><svg aria-hidden="true"><use href="icons/ui.svg#shield"/></svg><span data-i18n="localOnly"></span></span><span class="shortcut"><kbd>⌥ ⇧ T</kbd><span data-i18n="reopenAction"></span></span></footer>
  </main>
  <script src="core.js"></script>
  <script src="history.js"></script>
</body>
</html>
