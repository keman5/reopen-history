<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Reopen History</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="icons/icon48.png" width="32" height="32" alt=""><span>Reopen History</span></div>
      <h1 data-i18n="history"></h1>
      <p class="intro" data-i18n="intro"></p>
    </header>
    <section class="controls">
      <button id="reopen" class="primary" aria-controls="history" aria-expanded="true"><span aria-hidden="true">↶</span> <span data-i18n="reopen"></span></button>
      <p class="hint" data-i18n="pressHint"></p>
    </section>
    <p id="notice" class="notice" hidden data-i18n="safariNotice"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="history" aria-labelledby="list-heading">
      <div class="list-heading"><h2 id="list-heading" data-i18n="recent"></h2><span id="count"></span></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" data-i18n-placeholder="search" autocomplete="off"></label>
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </section>
    <footer data-i18n="privacy"></footer>
  </main>
  <script src="core.js"></script>
  <script src="history.js"></script>
</body>
</html>
